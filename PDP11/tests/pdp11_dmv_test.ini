dep 300 1000
dep 302 0
dep 1000 12737
dep 1002 100001
dep 1004 160020
dep 1006 12737
dep 1010 0
dep 1012 160022
dep 1014 0
dep 0 12737
dep 2 100201
dep 4 160020
dep 6 1
dep 10 0
dep pc 0
go
IF PC!=1016 return 1
IF DMV SEL2[0]!=0 return 1

echof "** DMV: RDO interrupt vector and handler release"
:: A control HALT request before mode establishment is a no-peer way to
:: create a documented procedural-error response.  The input handler clears
:: RQI and RDI, allowing the command to complete; the output handler then
:: clears RDO after the response is presented.
