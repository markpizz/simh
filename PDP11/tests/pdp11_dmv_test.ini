:: Standalone DMV regression fixture.  It is intentionally separate from the
:: simulator's conventional pdp11_test.ini so it can be reviewed and merged
:: independently of the pending KWV11 test changes.  Run it explicitly with:
::   BIN/pdp11 PDP11/tests/pdp11_dmv_test.ini -v
::
:: These checks cover the modeled host-visible DMV behavior.  They do not claim
:: to validate the card's 6502 firmware, ROM contents, MOP, or multipoint mode.

echof "** DMV: Q22 startup and maintenance-register entry"
set cpu 11/73 2048K
set dz disabled
set dmv enabled
set dmv address=17760020
set dmv vector=300
set dmv0 peer=localhost:65533
attach dmv0 localhost:65534
reset
IF DMV SEL4[0]!=33 return 1
IF DMV SEL6[0]!=305 return 1

echof "** DMV: RDI interrupt vector and handler release"
:: The input vector is the device vector and the output vector is four bytes
:: later.  Post a request with IEI enabled, let the controller assert RDI,
:: and have the handler clear RQI/RDI while preserving the control type.
