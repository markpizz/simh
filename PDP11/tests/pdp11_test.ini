;; Keeping the device-specific checks in their own file makes the scope 
:: and evidence easy to review while ensuring that `make pdp11`
:: cannot silently omit them.

cd %~p0
on error echof "One Test Failed"; exit 1
set on

do pdp11_kwv_test.ini
do pdp11_dmv_test.ini

echof "!!! All PDP11 Tests passed !!!"

